name: 代表戦の結果を自動取得

on:
  schedule:
    # 毎朝 6:30 JST (21:30 UTC)。日程更新(6:00)とずらして実行
    - cron: '30 21 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 代表戦の結果を取得
        run: node scrape-japan-results.js
      - name: 変更があればコミット
        run: |
          git config user.name "bcal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add japan.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "代表戦の結果を自動更新 $(date +%Y-%m-%d)"
            git push
          fi
