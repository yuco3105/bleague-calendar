name: EASL日程自動更新
on:
  schedule:
    - cron: '45 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scrape-easl.js
      - name: 変更があればコミット
        run: |
          git config user.name "bcal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add easl.json
          if ! git diff --cached --quiet; then
            git commit -m "EASL日程更新"
            git pull --rebase
            git push
          fi
